name: Secret Rotation

# ── #372: Automated quarterly secret rotation ─────────────────────────────────
#
# Rotates NEXTAUTH_SECRET (JWT) and STELLAR_SERVER_SECRET_KEY for each
# environment. Zero downtime: the outgoing value is kept in *_PREVIOUS and
# remains valid for one rotation period (see src/lib/jwt-rotation.ts and
# docs/ops/key-rotation.md). Each run appends to docs/ops/key-rotation-log.md
# and posts the result to Slack.
#
# Required secrets (per GitHub environment):
#   SECRETS_ADMIN_TOKEN        — PAT with `secrets:write` + `contents:write` on this repo
#   NEXTAUTH_SECRET, NEXTAUTH_SECRET_PREVIOUS
#   STELLAR_SERVER_SECRET_KEY, STELLAR_SERVER_SECRET_KEY_PREVIOUS
#   SLACK_WEBHOOK_URL
# Required variables (per GitHub environment):
#   STELLAR_HORIZON_URL, STELLAR_NETWORK_PASSPHRASE

on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *" # 03:00 UTC on the 1st of each quarter
  workflow_dispatch:

concurrency:
  group: secret-rotation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    env:
      GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
      TARGET_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRETS_ADMIN_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Rotate JWT secret (NEXTAUTH_SECRET)
        env:
          CURRENT_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          NEW_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$NEW_SECRET"
          gh secret set NEXTAUTH_SECRET_PREVIOUS --env "$TARGET_ENV" --body "$CURRENT_SECRET"
          gh secret set NEXTAUTH_SECRET --env "$TARGET_ENV" --body "$NEW_SECRET"

      - name: Rotate Stellar signing key
        id: stellar
        env:
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
          STELLAR_SERVER_SECRET_KEY_PREVIOUS: ${{ secrets.STELLAR_SERVER_SECRET_KEY_PREVIOUS }}
          STELLAR_HORIZON_URL: ${{ vars.STELLAR_HORIZON_URL }}
          STELLAR_NETWORK_PASSPHRASE: ${{ vars.STELLAR_NETWORK_PASSPHRASE }}
        run: npx ts-node scripts/rotate-stellar-key.ts

      - name: Store new Stellar key
        env:
          CURRENT_SECRET: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
          NEW_SECRET: ${{ steps.stellar.outputs.NEW_SECRET }}
        run: |
          gh secret set STELLAR_SERVER_SECRET_KEY_PREVIOUS --env "$TARGET_ENV" --body "$CURRENT_SECRET"
          gh secret set STELLAR_SERVER_SECRET_KEY --env "$TARGET_ENV" --body "$NEW_SECRET"

      - name: Append rotation log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NEW_PUBLIC: ${{ steps.stellar.outputs.NEW_PUBLIC || 'n/a' }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          {
            echo ""
            echo "## Rotation — $(date -u +%Y-%m-%d)"
            echo ""
            echo "- Secret Name: NEXTAUTH_SECRET, STELLAR_SERVER_SECRET_KEY"
            echo "- Rotated by: automated (secret-rotation workflow, run ${GITHUB_RUN_ID})"
            echo "- Reason: scheduled (quarterly)"
            echo "- Environment: ${TARGET_ENV}"
            echo "- Result: ${JOB_STATUS}"
            echo "- New Stellar Signer: ${NEW_PUBLIC}"
            echo "- Previous Secret Revoked / Deprecated: kept in *_PREVIOUS until next rotation"
          } >> docs/ops/key-rotation-log.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ops/key-rotation-log.md
          git commit -m "chore(ops): log ${TARGET_ENV} secret rotation [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":rotating_light:"; fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"${ICON} Secret rotation (${TARGET_ENV}): ${JOB_STATUS} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
